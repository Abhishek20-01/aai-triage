              </div>
              <div class="mt-1 flex items-center gap-2 text-xs text-slate-500">
                <span>Last visit: ${patient.lastVisit}</span>
                <span>•</span>
                <span>${patient.totalVisits} visits</span>
              </div>
            </div>
            <div class="text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </div>
          </div>
        </div>
      `;
    }

    function renderSidebar() {
      return `
        <div class="w-64 bg-slate-900 text-white flex flex-col h-screen">
          <div class="p-6 border-b border-slate-700">
            <div class="flex items-center gap-3 mb-1">
              <div class="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center text-xl font-bold">🏥</div>
              <div>
                <h1 class="text-lg font-bold">AarogyaAI</h1>
                <p class="text-xs text-slate-400">Triage Assistant</p>
              </div>
            </div>
          </div>
          <div class="p-4">
            <div class="relative">
              <input type="text" placeholder="Search patients..." value="${searchQuery}" oninput="updateSearch(this.value)" class="w-full px-3 py-2 bg-slate-800 text-white text-sm rounded-lg border border-slate-700 focus:outline-none focus:border-blue-500 placeholder-slate-400">
            </div>
          </div>
          <nav class="flex-1 px-3 py-2 space-y-1">
            <button onclick="navigateTo('dashboard')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium ${currentView === 'dashboard' ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
              <span class="text-lg">📊</span> Dashboard
            </button>
            <button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white">
              <span class="text-lg">👥</span> Patients
            </button>
            <button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white">
              <span class="text-lg">🩺</span> Consultations
            </button>
            <button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white">
              <span class="text-lg">📋</span> Reports
            </button>
          </nav>
          <div class="p-4 border-t border-slate-700">
            <button onclick="showConsentModal()" class="w-full flex items-center gap-2 px-3 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm text-slate-300 transition-colors">
              <span>🔒</span> Consent Management
            </button>
            <div class="mt-3 flex items-center gap-2 px-3 py-2">
              <div class="w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center text-xs">👨‍⚕️</div>
              <div class="flex-1">
                <p class="text-xs font-medium text-white">Dr. S. Verma</p>
                <p class="text-xs text-slate-400">PHC Rampur</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderPatientDetail(patient) {
      const visits = visitsData[patient.id] || [];
      const insight = getInsight(patient.id, visits, patient);
      const statusBadge = (status) => {
        const colors = { normal: 'bg-green-100 text-green-700', abnormal: 'bg-yellow-100 text-yellow-700', critical: 'bg-red-100 text-red-700' };
        return colors[status] || 'bg-slate-100 text-slate-700';
      };

      return `
        <div class="flex h-screen bg-slate-50">
          ${renderSidebar()}
          <main class="flex-1 overflow-y-auto">
            <header class="bg-white border-b border-slate-200 px-8 py-4">
              <div class="flex items-center justify-between">
                <div>
                  <h1 class="text-2xl font-bold text-slate-900">Patient Record</h1>
                  <p class="text-sm text-slate-600 mt-1">ABHA-linked Health Record — AI-Enhanced View</p>
                </div>
                <div class="flex items-center gap-2">
                  <span class="px-3 py-1.5 bg-red-100 text-red-700 rounded-full text-sm font-medium border border-red-300">${insight.urgencyScore}/10 Urgency Score</span>
                </div>
              </div>
            </header>
            <div class="p-8 space-y-6 fade-in">
              <div class="bg-white rounded-lg border border-slate-200">
                <div class="px-6 py-4">
                  <div class="flex items-start justify-between">
                    <div class="flex items-start gap-4">
                      <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-2xl font-bold text-blue-700">${patient.avatar}</div>
                      <div>
                        <h1 class="text-2xl font-bold text-slate-900">${patient.name}</h1>
                        <div class="mt-1 flex flex-wrap items-center gap-3 text-sm text-slate-600">
                          <span>${patient.age} years, ${patient.gender}</span>
                          <span>•</span>
                          <span>ABHA: ${patient.abhaId}</span>
                          <span>•</span>
                          <span>Blood: ${patient.bloodGroup}</span>
                        </div>
                        <div class="mt-2 flex flex-wrap items-center gap-3 text-xs text-slate-500">
                          <span>📱 ${patient.phone}</span>
                          <span>📍 ${patient.village}</span>
                          <span>🚨 ${patient.emergencyContact}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              ${insight.criticalAlerts.length > 0 ? `
              <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                <div class="flex items-start gap-3">
                  <div class="text-2xl">🚨</div>
                  <div class="flex-1">
                    <h2 class="text-lg font-semibold text-red-900 mb-3">Critical Alerts</h2>
                    <div class="space-y-2">
                      ${insight.criticalAlerts.map(alert => `
                        <div class="flex items-start gap-2 bg-white p-3 rounded border border-red-200">
                          <span class="text-red-600 mt-0.5">●</span>
                          <p class="text-sm text-red-900">${alert}</p>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                </div>
              </div>
              ` : ''}

              <div class="bg-white rounded-lg border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-900 mb-4">AI-Generated Summary</h2>
                <p class="text-sm text-slate-700 leading-relaxed">${insight.summary}</p>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div class="bg-white rounded-lg border border-slate-200 p-5">
                  <h3 class="text-sm font-semibold text-slate-900 mb-3">Risk Factors</h3>
                  <div class="space-y-2">
                    ${insight.riskFactors.map(risk => `
                      <div class="flex items-start gap-2">
                        <span class="text-orange-500 mt-0.5">⚠️</span>
                        <p class="text-sm text-slate-700">${risk}</p>
                      </div>
                    `).join('')}
                  </div>
                </div>
                <div class="bg-white rounded-lg border border-slate-200 p-5">
                  <h3 class="text-sm font-semibold text-slate-900 mb-3">Chronic Conditions</h3>
                  <div class="space-y-2">
                    ${insight.chronicConditions.map(condition => `
                      <div class="flex items-start gap-2">
                        <span class="text-blue-500 mt-0.5">🏥</span>
                        <p class="text-sm text-slate-700">${condition}</p>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>

              <div class="bg-white rounded-lg border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-900 mb-4">Recommendations</h2>
                <div class="grid grid-cols-1 gap-2">
                  ${insight.recommendations.map((rec, idx) => `
                    <div class="flex items-start gap-3 p-3 bg-blue-50 rounded border border-blue-100">
                      <span class="text-blue-600 font-bold">${idx + 1}.</span>
                      <p class="text-sm text-slate-700">${rec}</p>
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="bg-white rounded-lg border border-slate-200">
                <div class="px-6 py-4 border-b border-slate-200">
                  <h2 class="text-lg font-semibold text-slate-900">Visit History (${visits.length} visits)</h2>
                </div>
                <div class="divide-y divide-slate-100">
                  ${visits.map(visit => renderVisitCard(visit, statusBadge)).join('')}
                </div>
              </div>

              <button onclick="showConsentModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors">
                🔒 Manage ABHA Consent & Privacy
              </button>

              <div class="bg-white rounded-lg border border-slate-200 p-6">
                <h3 class="text-lg font-semibold text-slate-900 mb-4">Allergies & Safety</h3>
                <div class="flex flex-wrap gap-2">
                  ${patient.allergies.map(allergy => `
                    <span class="px-3 py-2 bg-yellow-100 text-yellow-900 rounded-lg border border-yellow-300 font-medium">⚠️ ${allergy}</span>
                  `).join('')}
                </div>
                <div class="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg">
                  <p class="text-sm text-red-800 font-medium">Emergency Contact: ${patient.emergencyContact}</p>
                </div>
              </div>
            </div>
          </main>
        </div>
      `;
    }

    function renderVisitCard(visit, statusBadge) {
      return `
        <div class="p-5">
          <div class="flex items-start justify-between">
            <div class="flex-1">
              <div class="flex items-center gap-3 mb-2">
                <h3 class="text-sm font-semibold text-slate-900">${visit.type}</h3>
                <span class="text-xs text-slate-500">${visit.date}</span>
                <span class="text-xs text-slate-500">•</span>
                <span class="text-xs text-slate-500">${visit.facility}</span>
              </div>
              <p class="text-sm text-slate-700 font-medium">${visit.diagnosis}</p>
              <div class="mt-2 flex flex-wrap gap-1">
                ${visit.symptoms.map(s => `<span class="px-2 py-1 bg-slate-100 text-slate-700 rounded text-xs">${s}</span>`).join('')}
              </div>
            </div>
          </div>
          <div class="mt-4 space-y-4">
            <div>
              <h4 class="text-xs font-semibold text-slate-700 mb-2 uppercase tracking-wide">Vitals</h4>
              <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                ${Object.entries(visit.vitals).filter(([k, v]) => v).map(([key, value]) => `
                  <div class="bg-slate-50 p-2 rounded border border-slate-200">
                    <div class="text-xs text-slate-600 capitalize">${key}</div>
                    <div class="text-sm font-medium text-slate-900 mt-0.5">${value}</div>
                  </div>
                `).join('')}
              </div>
            </div>
            ${visit.prescriptions.length > 0 ? `
            <div>
              <h4 class="text-xs font-semibold text-slate-700 mb-2 uppercase tracking-wide">Prescriptions</h4>
              <div class="space-y-2">
                ${visit.prescriptions.map(rx => `
                  <div class="flex items-center justify-between p-3 bg-blue-50 rounded border border-blue-100">
                    <div>
                      <div class="text-sm font-medium text-slate-900">${rx.medication}</div>
                      <div class="text-xs text-slate-600 mt-0.5">${rx.dosage} • ${rx.frequency} • ${rx.duration}</div>
                      <div class="text-xs text-slate-500 mt-0.5">${rx.instructions}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
            ` : ''}
            ${visit.labResults.length > 0 ? `
            <div>
              <h4 class="text-xs font-semibold text-slate-700 mb-2 uppercase tracking-wide">Lab Results</h4>
              <div class="overflow-x-auto">
                <table class="w-full text-sm">
                  <thead>
                    <tr class="border-b border-slate-200">
                      <th class="text-left py-2 px-3 text-xs font-semibold text-slate-700">Test</th>
                      <th class="text-left py-2 px-3 text-xs font-semibold text-slate-700">Date</th>
                      <th class="text-left py-2 px-3 text-xs font-semibold text-slate-700">Value</th>
                      <th class="text-left py-2 px-3 text-xs font-semibold text-slate-700">Reference</th>
                      <th class="text-left py-2 px-3 text-xs font-semibold text-slate-700">Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${visit.labResults.map(lab => `
                      <tr class="border-b border-slate-100">
                        <td class="py-2 px-3 text-slate-900">${lab.test}</td>
                        <td class="py-2 px-3 text-slate-600">${lab.date}</td>
                        <td class="py-2 px-3 font-medium text-slate-900">${lab.value}</td>
                        <td class="py-2 px-3 text-slate-600">${lab.referenceRange}</td>
                        <td class="py-2 px-3"><span class="px-2 py-1 rounded-full text-xs font-medium ${statusBadge(lab.status)}">${lab.status}</span></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
            ` : ''}
            ${visit.notes ? `
            <div>
              <h4 class="text-xs font-semibold text-slate-700 mb-2 uppercase tracking-wide">Doctor's Notes</h4>
              <p class="text-sm text-slate-700 bg-yellow-50 p-3 rounded border border-yellow-200">${visit.notes}</p>
            </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function renderConsentModal() {
      if (!showConsent) return '';
      const patient = selectedPatientId ? patients.find(p => p.id === selectedPatientId) : null;
      return `
        <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
          <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
              <h2 class="text-xl font-bold text-slate-900">Consent & Privacy Management</h2>
              <button onclick="hideConsentModal()" class="text-slate-400 hover:text-slate-600 text-2xl leading-none">×</button>
            </div>
            <div class="p-6 space-y-6">
              <div>
                <h3 class="text-lg font-semibold text-slate-900 mb-3">${patient ? patient.name : 'Patient'} (${patient ? patient.abhaId : ''})</h3>
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                  <h4 class="text-sm font-semibold text-blue-900 mb-2">ABHA Consent Framework</h4>
                  <p class="text-sm text-blue-800">This patient has provided consent for access to their health records through the Ayushman Bharat Digital Health Mission (ABDM) framework. All access is logged and auditable.</p>
                </div>
              </div>
              <div class="space-y-3">
                <h4 class="text-sm font-semibold text-slate-900">Consent Status</h4>
                ${[
                  { label: 'Health Record Access', status: 'Active' },
                  { label: 'Diagnostic Data Sharing', status: 'Active' },
                  { label: 'Medication History Access', status: 'Active' },
                  { label: 'Research Participation', status: 'Declined' },
                  { label: 'SMS/Notification', status: 'Active' },
                ].map(item => `
                  <div class="flex items-center justify-between p-3 bg-slate-50 rounded border border-slate-200">
                    <span class="text-sm text-slate-700">${item.label}</span>
                    <span class="px-3 py-1 rounded-full text-xs font-medium ${item.status === 'Active' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${item.status}</span>
                  </div>
                `).join('')}
              </div>
              <div>
                <h4 class="text-sm font-semibold text-slate-900 mb-3">Access Log</h4>
                <div class="space-y-2">
                  ${[
                    { date: '2025-10-10', doctor: 'Dr. S. Verma', action: 'Viewed full record', ip: '10.0.1.45' },
                    { date: '2025-10-08', doctor: 'Dr. S. Verma', action: 'Updated consultation notes', ip: '10.0.1.45' },
                    { date: '2025-09-24', doctor: 'Dr. S. Verma', action: 'Viewed lab results', ip: '10.0.1.45' },
                    { date: '2025-09-10', doctor: 'Dr. R. Gupta', action: 'Accessed via referral', ip: '10.0.2.12' },
                  ].map(log => `
                    <div class="flex items-center gap-4 p-2 bg-slate-50 rounded text-xs">
                      <span class="text-slate-600 w-28">${log.date}</span>
                      <span class="text-slate-900 font-medium w-40">${log.doctor}</span>
                      <span class="text-slate-700 flex-1">${log.action}</span>
                      <span class="text-slate-500">${log.ip}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
              <div class="bg-yellow-50 p-4 rounded-lg border border-yellow-200">
                <h4 class="text-sm font-semibold text-yellow-900 mb-2">Privacy & Compliance Notes</h4>
                <ul class="space-y-1 text-xs text-yellow-800 list-disc list-inside">
                  <li>All access is logged per ABDM guidelines</li>
                  <li>Records are accessed only with patient consent</li>
                  <li>Data is encrypted in transit and at rest</li>
                  <li>Access is limited to treating physicians only</li>
                  <li>Patients can revoke consent at any time</li>
                </ul>
              </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-200 flex justify-end gap-3">
              <button onclick="hideConsentModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-900 rounded-lg text-sm font-medium transition-colors">Close</button>
              <button class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors">Modify Consent</button>
            </div>
          </div>
        </div>
      `;
    }

    function navigateToPatient(patientId) {
      selectedPatientId = patientId;
      currentView = 'patient';
      render();
    }

    function navigateTo(view) {
      currentView = view;
      render();
    }

    function showConsentModal() {
      showConsent = true;
      render();
    }

    function hideConsentModal() {
      showConsent = false;
      render();
    }

    function updateSearch(value) {
      searchQuery = value;
      currentView = 'dashboard';
      render();
    }

    function render() {
      const app = document.getElementById('app');
      if (currentView === 'dashboard') {
        app.innerHTML = renderDashboard();
      } else if (currentView === 'patient') {
        const patient = patients.find(p => p.id === selectedPatientId);
        app.innerHTML = patient ? renderPatientDetail(patient) : renderDashboard();
      }
      if (showConsent) {
        const consentDiv = document.createElement('div');
        consentDiv.id = 'consent-overlay';
        consentDiv.innerHTML = renderConsentModal();
        document.body.appendChild(consentDiv);
      }
    }

    render();
  </script>
</body>
</html>
