<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AarogyaAI — AI-Powered Diagnostic Triage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --critical: #ef4444;
      --high: #f97316;
      --medium: #fbbf24;
      --low: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 260px;
      height: 100vh;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      color: white;
      padding: 24px 0;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 4px 0 20px rgba(0,0,0,0.1);
    }

    .logo {
      padding: 0 24px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 24px;
    }

    .logo h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo p {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      color: #cbd5e1;
      text-decoration: none;
      transition: all 0.2s;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(59, 130, 246, 0.1);
      color: #3b82f6;
    }

    .nav-item.active {
      border-left: 3px solid #3b82f6;
    }

    .nav-icon {
      font-size: 20px;
    }

    .sidebar-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 24px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .doctor-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .doctor-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .doctor-details h4 {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .doctor-details p {
      font-size: 11px;
      color: #94a3b8;
    }

    /* Main Content */
    .main {
      margin-left: 260px;
      min-height: 100vh;
    }

    .header {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 24px 40px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h2 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
    }

    .header p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-secondary {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg);
    }

    /* Content */
    .content {
      padding: 32px 40px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.3s;
      cursor: pointer;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.08);
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 8px;
      font-weight: 500;
    }

    /* Patient List */
    .patient-list {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .list-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-header h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      padding: 8px 16px 8px 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      width: 280px;
      font-family: inherit;
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
    }

    .patient-item {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .patient-item:last-child {
      border-bottom: none;
    }

    .patient-item:hover {
      background: #f8fafc;
    }

    .patient-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
    }

    .patient-info {
      flex: 1;
      min-width: 0;
    }

    .patient-name {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .patient-meta {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .urgency-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .urgency-critical {
      background: #fef2f2;
      color: var(--critical);
      border: 1px solid #fecaca;
    }

    .urgency-high {
      background: #fff7ed;
      color: var(--high);
      border: 1px solid #fed7aa;
    }

    .urgency-medium {
      background: #fffbeb;
      color: var(--medium);
      border: 1px solid #fde68a;
    }

    .urgency-low {
      background: #f0fdf4;
      color: var(--low);
      border: 1px solid #bbf7d0;
    }

    /* Patient Detail */
    .patient-detail {
      display: none;
    }

    .patient-detail.active {
      display: block;
    }

    .back-btn {
      margin-bottom: 24px;
    }

    .patient-header {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 24px;
    }

    .patient-header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .patient-identity {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .patient-avatar-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
    }

    .urgency-score {
      text-align: right;
    }

    .urgency-score-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .urgency-score-value {
      font-size: 48px;
      font-weight: 800;
      color: var(--critical);
      line-height: 1;
    }

    .urgency-score-max {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .patient-details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    /* Alert Section */
    .alert-section {
      background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
      border: 2px solid #fecaca;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .alert-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .alert-icon {
      font-size: 28px;
    }

    .alert-title {
      font-size: 18px;
      font-weight: 700;
      color: #991b1b;
    }

    .alert-item {
      background: white;
      border-left: 4px solid var(--critical);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      color: #991b1b;
    }

    /* AI Summary */
    .ai-section {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ai-summary {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.7;
      color: #1e3a8a;
    }

    /* Two Column Layout */
    .two-column {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 24px;
    }

    .info-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    .info-card h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .info-list {
      list-style: none;
    }

    .info-list li {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .info-list li:last-child {
      border-bottom: none;
    }

    .info-list li::before {
      content: "▸";
      color: var(--primary);
      font-weight: bold;
    }

    /* Recommendations */
    .recommendations {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .recommendation-item {
      display: flex;
      gap: 16px;
      padding: 16px;
      background: linear-gradient(135deg, #eff6ff 0%, #f5f3ff 100%);
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      margin-bottom: 12px;
      align-items: flex-start;
    }

    .recommendation-number {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    .recommendation-text {
      flex: 1;
      font-size: 13px;
      line-height: 1.6;
    }

    /* Visit History */
    .visits-section {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .visits-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .visits-header h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .visit-card {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .visit-card:last-child {
      border-bottom: none;
    }

    .visit-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .visit-type {
      display: inline-block;
      padding: 4px 12px;
      background: #dbeafe;
      color: #1e40af;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .visit-date {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .visit-diagnosis {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .visit-symptoms {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .symptom-tag {
      padding: 4px 10px;
      background: #f1f5f9;
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .visit-details {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .detail-section {
      margin-bottom: 20px;
    }

    .detail-section h4 {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .vitals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .vital-card {
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .vital-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: capitalize;
      margin-bottom: 4px;
    }

    .vital-value {
      font-size: 14px;
      font-weight: 600;
    }

    /* Lab Results Table */
    .lab-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .lab-table th {
      text-align: left;
      padding: 10px 12px;
      background: #f8fafc;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
    }

    .lab-table td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    .lab-table tr:hover {
      background: #f8fafc;
    }

    .lab-status {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      display: inline-block;
    }

    .lab-critical {
      background: #fef2f2;
      color: var(--critical);
    }

    .lab-abnormal {
      background: #fffbeb;
      color: #b45309;
    }

    .lab-normal {
      background: #f0fdf4;
      color: var(--low);
    }

    /* Allergies */
    .allergies-section {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .allergy-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .allergy-tag {
      padding: 6px 14px;
      background: white;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      font-size: 13px;
      color: #991b1b;
      font-weight: 500;
    }

    .emergency-contact {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: white;
      border-radius: 8px;
      font-size: 13px;
      color: #991b1b;
      font-weight: 600;
    }

    /* Consent Button */
    .consent-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .consent-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
    }

    /* Consent Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 16px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .modal-header {
      padding: 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .modal-header h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .modal-header p {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 32px;
      color: var(--text-secondary);
      cursor: pointer;
      line-height: 1;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    .modal-close:hover {
      background: var(--bg);
    }

    .modal-body {
      padding: 24px;
    }

    .consent-info {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .consent-info h4 {
      font-size: 14px;
      font-weight: 600;
      color: #1e3a8a;
      margin-bottom: 8px;
    }

    .consent-info p {
      font-size: 13px;
      color: #1e40af;
      line-height: 1.6;
    }

    .consent-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      background: #f8fafc;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
    }

    .consent-item-label {
      font-size: 13px;
      font-weight: 500;
    }

    .consent-item-desc {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .consent-status {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .consent-active {
      background: #dcfce7;
      color: #166534;
    }

    .consent-inactive {
      background: #fee2e2;
      color: #991b1b;
    }

    .access-log {
      margin-top: 24px;
    }

    .access-log h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .log-entry {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      gap: 12px;
      padding: 10px 12px;
      background: #f8fafc;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 12px;
      border: 1px solid var(--border);
    }

    .log-date {
      color: var(--text-secondary);
      font-family: monospace;
    }

    .log-action {
      color: var(--text);
    }

    .log-ip {
      color: var(--text-secondary);
      font-family: monospace;
    }

    .compliance-box {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 16px;
      margin-top: 24px;
    }

    .compliance-box h4 {
      font-size: 14px;
      font-weight: 600;
      color: #92400e;
      margin-bottom: 8px;
    }

    .compliance-box ul {
      list-style: none;
      font-size: 12px;
      color: #a16207;
    }

    .compliance-box li {
      padding: 4px 0;
      padding-left: 16px;
      position: relative;
    }

    .compliance-box li::before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #65a30d;
      font-weight: bold;
    }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        position: relative;
        height: auto;
      }

      .main {
        margin-left: 0;
      }

      .header {
        padding: 16px 20px;
      }

      .content {
        padding: 20px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .patient-header-top {
        flex-direction: column;
        gap: 16px;
      }

      .two-column {
        grid-template-columns: 1fr;
      }
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .slide-in {
      animation: slideIn 0.3s ease-out;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }

    ::-webkit-scrollbar {

      background: #cbd5e1;
      border-radius: 4px;
    }

      background: #94a3b8;
    }

        summary: '70-year-old male with COPD exacerbation superimposed on Congestive Heart Failure. BNP markedly elevated (1850) indicating severe heart failure. Hypoxemia (SpO2 88%) requires oxygen therapy. Multisystem failure risk — cardiopulmonary interaction critical.',
        criticalAlerts: [
          'BNP 1850 pg/mL — indicates severe decompensated heart failure',
          'SpO2 88% — severe hypoxemia, immediate oxygen needed',
          'Potassium 5.2 mEq/L — elevated (on diuretics, monitor closely)',
          'Creatinine 1.8 mg/dL — acute kidney injury likely from diuretic overuse',
          'Age 70 with COPD + CHF — high mortality risk'
        ],
        riskFactors: [
          'Age > 70 (highest mortality risk)',
          'Dual cardiopulmonary disease',
          'Acute exacerbation of chronic conditions',
          'Possible fluid overload',
          'Reduced exercise tolerance'
        ],
        medicationIssues: [
          'Diuretic dose doubled — monitor renal function and electrolytes',
          'Inhaled corticosteroid + LABA initiated — appropriate for COPD',
          'Beta-agonist may be needed for bronchospasm',
          'Anticoagulation needed for CHF (no mention of current use)'
        ],
        chronicConditions: ['COPD', 'Congestive Heart Failure', 'Chronic Kidney Disease'],
        recommendations: [
          'Continuous oxygen monitoring — target SpO2 > 92%',
          'Daily weight and fluid balance monitoring',
          'Add Enalapril or Sacubitril when stable for CHF',
          'Start anticoagulation if atrial fibrillation or low EF',
          'Pulmonary rehabilitation after stabilization',
          'Annual influenza and pneumococcal vaccination',
          'Smoking cessation if applicable (critical for COPD)',
          'Nutritional support — high protein, low sodium diet',
          'Home oxygen assessment for discharge planning',
          'Close monitoring of K+ and Creatinine with high-dose diuretics'
        ],
        urgencyScore: 10
      }
    };

    // ============================================
    // STATE MANAGEMENT
    // ============================================

    let currentView = 'dashboard';
    let selectedPatientId = null;
    let showConsent = false;
    let searchQuery = '';

    // ============================================
    // UTILITY FUNCTIONS
    // ============================================

    function getInsight(patientId, visits, patient) {
      if (aiInsights[patientId]) {
        return aiInsights[patientId];
      }
      const lastVisit = visits[0];
      return {
        summary: lastVisit
          ? `Patient ${patient.name} (${patient.age} years, ${patient.gender}) with ${lastVisit.diagnosis.toLowerCase()}. Last visited ${lastVisit.facility} on ${lastVisit.date}. ${lastVisit.notes}`
          : 'No visits recorded yet. Complete initial assessment.',
        criticalAlerts: ['No critical alerts at this time'],
        riskFactors: ['Age-related risk factors', 'Lifestyle factors', 'Family history if documented'],
        medicationIssues: visits.flatMap(v => v.prescriptions).length > 0 ? ['Review medication adherence at next visit'] : ['No current medications'],
        chronicConditions: [...new Set(visits.map(v => v.diagnosis).slice(0, 3))],
        recommendations: ['Regular follow-up as scheduled', 'Monitor symptoms and report changes', 'Maintain healthy lifestyle'],
        urgencyScore: patient.urgencyLevel === 'critical' ? 8 : patient.urgencyLevel === 'high' ? 6 : patient.urgencyLevel === 'medium' ? 4 : 2
      };
    }

    function getUrgencyClass(level) {
      const classes = {
        critical: 'urgency-critical',
        high: 'urgency-high',
        medium: 'urgency-medium',
        low: 'urgency-low'
      };
      return classes[level] || 'urgency-low';
    }

    function getUrgencyColor(level) {
      const colors = {
        critical: '#ef4444',
        high: '#f97316',
        medium: '#fbbf24',
        low: '#10b981'
      };
      return colors[level] || '#10b981';
    }

    // ============================================
    // RENDER FUNCTIONS
    // ============================================

    function renderDashboard() {
      const criticalCount = patients.filter(p => p.urgencyLevel === 'critical').length;
      const highCount = patients.filter(p => p.urgencyLevel === 'high').length;
      const filtered = patients.filter(p =>
        p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        p.abhaId.toLowerCase().includes(searchQuery.toLowerCase()) ||
        p.village.toLowerCase().includes(searchQuery.toLowerCase())
      );

      return `
        <div class="main fade-in">
          <div class="header">
            <div class="header-content">
              <div>
                <h2>Dashboard</h2>
                <p>Welcome back, Dr. S. Verma — Primary Health Center, Rampur</p>
              </div>
              <div class="header-actions">
                <button class="btn btn-secondary">📅 Today: Oct 10, 2025</button>
                <button class="btn btn-primary">+ New Consultation</button>
              </div>
            </div>
          </div>
          <div class="content">
            <div class="stats-grid">
              <div class="stat-card">
                <div class="stat-header">
                  <div>
                    <div class="stat-label">Total Patients</div>
                    <div class="stat-value">${patients.length}</div>
                  </div>
                  <div class="stat-icon" style="background: #dbeafe; color: #3b82f6;">👥</div>
                </div>
              </div>
              <div class="stat-card">
                <div class="stat-header">
                  <div>
                    <div class="stat-label">Critical Cases</div>
                    <div class="stat-value" style="color: var(--critical);">${criticalCount}</div>
                  </div>
                  <div class="stat-icon" style="background: #fee2e2; color: var(--critical);">🚨</div>
                </div>
              </div>
              <div class="stat-card">
                <div class="stat-header">
                  <div>
                    <div class="stat-label">High Priority</div>
                    <div class="stat-value" style="color: var(--high);">${highCount}</div>
                  </div>
                  <div class="stat-icon" style="background: #ffedd5; color: var(--high);">⚠️</div>
                </div>
              </div>
              <div class="stat-card">
                <div class="stat-header">
                  <div>
                    <div class="stat-label">Today's Visits</div>
                    <div class="stat-value" style="color: var(--primary);">12</div>
                  </div>
                  <div class="stat-icon" style="background: #dbeafe; color: var(--primary);">📅</div>
                </div>
              </div>
            </div>

            <div class="patient-list">
              <div class="list-header">
                <h3>Patient Registry (${filtered.length})</h3>
                <div class="search-box">
                  <input type="text" placeholder="Search patients..." value="${searchQuery}" oninput="updateSearch(this.value)">
                </div>
              </div>
              <div class="list-body">
                ${filtered.map(patient => renderPatientRow(patient)).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderPatientRow(patient) {
      return `
        <div class="patient-item" onclick="navigateToPatient('${patient.id}')">
          <div class="patient-avatar">${patient.avatar}</div>
          <div class="patient-info">
            <div class="patient-name">${patient.name}</div>
            <div class="patient-meta">
              <span>${patient.age}y, ${patient.gender}</span>
              <span>${patient.abhaId}</span>
              <span>📍 ${patient.village}</span>
            </div>
            <div class="patient-meta" style="margin-top: 4px;">
              <span>Last visit: ${patient.lastVisit}</span>
              <span>${patient.totalVisits} visits</span>
            </div>
          </div>
          <span class="urgency-badge ${getUrgencyClass(patient.urgencyLevel)}">${patient.urgencyLevel}</span>
        </div>
      `;
    }

    function renderPatientDetail(patient) {
      const visits = visitsData[patient.id] || [];
      const insight = getInsight(patient.id, visits, patient);

      return `
        <div class="main fade-in">
          <div class="header">
            <div class="header-content">
              <div>
                <h2>Patient Record</h2>
                <p>ABHA-linked Health Record — AI-Enhanced Clinical View</p>
              </div>
              <div class="header-actions">
                <button class="btn btn-secondary" onclick="navigateToDashboard()">← Back to Dashboard</button>
              </div>
            </div>
          </div>
          <div class="content">
            <div class="patient-header">
              <div class="patient-header-top">
                <div class="patient-identity">
                  <div class="patient-avatar-large">${patient.avatar}</div>
                  <div>
                    <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 8px;">${patient.name}</h1>
                    <div class="patient-meta" style="font-size: 14px;">
                      <span>${patient.age} years, ${patient.gender}</span>
                      <span>${patient.abhaId}</span>
                      <span>Blood: ${patient.bloodGroup}</span>
                    </div>
                    <div class="patient-meta" style="margin-top: 8px;">
                      <span>📱 ${patient.phone}</span>
                      <span>📍 ${patient.village}</span>
                      <span>🚨 Emergency: ${patient.emergencyContact}</span>
                    </div>
                  </div>
                </div>
                <div class="urgency-score">
                  <div class="urgency-score-label">Urgency Score</div>
                  <div class="urgency-score-value">${insight.urgencyScore}</div>
                  <div class="urgency-score-max">/10</div>
                </div>
              </div>
              <div class="patient-details-grid">
                <div class="detail-item">
                  <div class="detail-label">ABHA ID</div>
                  <div class="detail-value" style="font-family: monospace; font-size: 12px;">${patient.abhaId}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label">Blood Group</div>
                  <div class="detail-value">${patient.bloodGroup}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label">Total Visits</div>
                  <div class="detail-value">${patient.totalVisits}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label">Registered</div>
                  <div class="detail-value">${patient.registeredAt}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label">Last Visit</div>
                  <div class="detail-value">${patient.lastVisit}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label">Allergies</div>
                  <div class="detail-value" style="color: var(--critical);">${patient.allergies.join(', ')}</div>
                </div>
              </div>
            </div>

            ${insight.criticalAlerts.length > 0 && insight.criticalAlerts[0] !== 'No critical alerts at this time' ? `
              <div class="alert-section slide-in">
                <div class="alert-header">
                  <span class="alert-icon">🚨</span>
                  <span class="alert-title">Critical Alerts</span>
                </div>
                ${insight.criticalAlerts.map(alert => `
                  <div class="alert-item">${alert}</div>
                `).join('')}
              </div>
            ` : ''}

            <div class="ai-section">
              <div class="section-title">🤖 AI-Generated Clinical Summary</div>
              <div class="ai-summary">${insight.summary}</div>
            </div>

            <div class="two-column">
              <div class="info-card">
                <h3>⚠️ Risk Factors</h3>
                <ul class="info-list">
                  ${insight.riskFactors.map(risk => `<li>${risk}</li>`).join('')}
                </ul>
              </div>
              <div class="info-card">
                <h3>🏥 Chronic Conditions</h3>
                <ul class="info-list">
                  ${insight.chronicConditions.map(condition => `<li>${condition}</li>`).join('')}
                </ul>
              </div>
            </div>

            <div class="recommendations">
              <div class="section-title">💡 Clinical Recommendations</div>
              ${insight.recommendations.map((rec, idx) => `
                <div class="recommendation-item">
                  <div class="recommendation-number">${idx + 1}</div>
                  <div class="recommendation-text">${rec}</div>
                </div>
              `).join('')}
            </div>

            <div class="visits-section">
              <div class="visits-header">
                <h3>Visit History (${visits.length} visits)</h3>
              </div>
              ${visits.map(visit => renderVisitCard(visit)).join('')}
            </div>

            <div class="allergies-section">
              <h3 style="font-weight: 600; margin-bottom: 12px; font-size: 15px;">⚠️ Allergies & Safety Alerts</h3>
              <div class="allergy-tags">
                ${patient.allergies.map(allergy => `
                  <span class="allergy-tag">⚠️ ${allergy}</span>
                `).join('')}
              </div>
              <div class="emergency-contact">
                🚨 Emergency Contact: ${patient.emergencyContact}
              </div>
            </div>

            <button class="consent-btn" onclick="showConsentModal()">
              🔒 Manage ABHA Consent & Privacy Settings
            </button>
          </div>
        </div>
        ${showConsent ? renderConsentModal(patient) : ''}
      `;
    }

    function renderVisitCard(visit) {
      return `
        <div class="visit-card">
          <div class="visit-header">
            <div>
              <span class="visit-type">${visit.type}</span>
              <span class="visit-date" style="margin-left: 12px;">${visit.date}</span>
            </div>
            <span class="visit-date">${visit.facility}</span>
          </div>
          <div class="visit-diagnosis">${visit.diagnosis}</div>
          <div class="visit-symptoms">
            ${visit.symptoms.map(s => `<span class="symptom-tag">${s}</span>`).join('')}
          </div>

          <div class="visit-details">
            <div class="detail-section">
              <h4>Vitals</h4>
              <div class="vitals-grid">
                ${Object.entries(visit.vitals).filter(([_, v]) => v).map(([key, value]) => `
                  <div class="vital-card">
                    <div class="vital-label">${key}</div>
                    <div class="vital-value">${value}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            ${visit.prescriptions.length > 0 ? `
              <div class="detail-section">
                <h4>Prescriptions</h4>
                ${visit.prescriptions.map(rx => `
                  <div style="background: #dbeafe; border: 1px solid #bfdbfe; padding: 12px; border-radius: 8px; margin-bottom: 8px;">
                    <div style="font-weight: 600; font-size: 13px;">${rx.medication}</div>
                    <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
                      ${rx.dosage} • ${rx.frequency} • ${rx.duration}
                    </div>
                    <div style="font-size: 11px; color: var(--text-secondary); margin-top: 4px; font-style: italic;">${rx.instructions}</div>
                  </div>
                `).join('')}
              </div>
            ` : ''}

            ${visit.labResults.length > 0 ? `
              <div class="detail-section">
                <h4>Lab Results</h4>
                <table class="lab-table">
                  <thead>
                    <tr>
                      <th>Test</th>
                      <th>Date</th>
                      <th>Value</th>
                      <th>Reference Range</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${visit.labResults.map(lab => `
                      <tr>
                        <td>${lab.test}</td>
                        <td>${lab.date}</td>
                        <td><strong>${lab.value} ${lab.unit}</strong></td>
                        <td>${lab.referenceRange}</td>
                        <td><span class="lab-status lab-${lab.status}">${lab.status}</span></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            ` : ''}

            ${visit.notes ? `
              <div class="detail-section">
                <h4>Doctor's Clinical Notes</h4>
                <p style="background: #fffbeb; border: 1px solid #fde68a; padding: 12px; border-radius: 8px; font-size: 13px; font-style: italic; color: #92400e;">
                  ${visit.notes}
                </p>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function renderConsentModal(patient) {
      return `
        <div class="modal-overlay active" onclick="hideConsentModal(event)">
          <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
              <div>
                <h2>Consent & Privacy Management</h2>
                <p>ABHA-linked Health Records — ABDM Compliance</p>
              </div>
              <button class="modal-close" onclick="hideConsentModal()">×</button>
            </div>
            <div class="modal-body">
              <div>
                <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 12px;">
                  ${patient.name} (${patient.abhaId})
                </h3>
                <div class="consent-info">
                  <h4>🔐 ABHA Consent Framework</h4>
                  <p>This patient has provided informed consent for access to their health records through the Ayushman Bharat Digital Health Mission (ABDM) framework. All access is logged, auditable, and compliant with the Digital Personal Data Protection Act (DPDPA).</p>
                </div>
              </div>

              <div>
                <h4 style="font-size: 14px; font-weight: 600; margin-bottom: 12px;">Consent Permissions</h4>
                ${[
                  { label: 'Health Record Access', desc: 'Full access to ABHA-linked health records', active: true },
                  { label: 'Diagnostic Data Sharing', desc: 'Lab results and diagnostic reports', active: true },
                  { label: 'Medication History Access', desc: 'Current and past prescriptions', active: true },
                  { label: 'Research Participation', desc: 'Anonymous data for research', active: false },
                  { label: 'SMS/Notification', desc: 'Appointment reminders and health alerts', active: true }
                ].map(item => `
                  <div class="consent-item">
                    <div>
                      <div class="consent-item-label">${item.label}</div>
                      <div class="consent-item-desc">${item.desc}</div>
                    </div>
                    <span class="consent-status ${item.active ? 'consent-active' : 'consent-inactive'}">
                      ${item.active ? 'Active' : 'Declined'}
                    </span>
                  </div>
                `).join('')}
              </div>

              <div class="access-log">
                <h4>Access Audit Log</h4>
                ${[
                  { date: '2025-10-10', doctor: 'Dr. S. Verma', action: 'Viewed full patient record', ip: '10.0.1.45' },
                  { date: '2025-10-08', doctor: 'Dr. S. Verma', action: 'Updated consultation notes', ip: '10.0.1.45' },
                  { date: '2025-09-24', doctor: 'Dr. S. Verma', action: 'Accessed lab results', ip: '10.0.1.45' },
                  { date: '2025-09-10', doctor: 'Dr. R. Gupta', action: 'Accessed via referral', ip: '10.0.2.12' }
                ].map(log => `
                  <div class="log-entry">
                    <span class="log-date">${log.date}</span>
                    <span class="log-action">${log.doctor} — ${log.action}</span>
                    <span class="log-ip">${log.ip}</span>
                  </div>
                `).join('')}
              </div>

              <div class="compliance-box">
                <h4>🛡️ Privacy & Compliance Information</h4>
                <ul>
                  <li>All access is logged per ABDM and DPDPA guidelines</li>
                  <li>Records accessed only with explicit patient consent</li>
                  <li>End-to-end encryption for data in transit and at rest</li>
                  <li>Access limited to authorized treating physicians only</li>
                  <li>Patients can revoke consent at any time</li>
                </ul>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" onclick="hideConsentModal()">Close</button>
              <button class="btn btn-primary">Modify Consent Settings</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderSidebar() {
      return `
        <div class="sidebar">
          <div class="logo">
            <h1>AarogyaAI</h1>
            <p>Triage Assistant</p>
          </div>
          <nav>
            <button class="nav-item ${currentView === 'dashboard' ? 'active' : ''}" onclick="navigateToDashboard()">
              <span class="nav-icon">📊</span>
              Dashboard
            </button>
            <button class="nav-item" onclick="alert('Coming soon!')">
              <span class="nav-icon">👥</span>
              Patients
            </button>
            <button class="nav-item" onclick="alert('Coming soon!')">
              <span class="nav-icon">🩺</span>
              Consultations
            </button>
            <button class="nav-item" onclick="alert('Coming soon!')">
              <span class="nav-icon">📋</span>
              Reports
            </button>
          </nav>
          <div class="sidebar-footer">
            <button class="nav-item" style="padding: 12px 0;" onclick="showConsentModalGlobal()">
              <span class="nav-icon">🔒</span>
              Consent Management
            </button>
            <div class="doctor-info" style="margin-top: 16px;">
              <div class="doctor-avatar">👨‍⚕️</div>
              <div class="doctor-details">
                <h4>Dr. S. Verma</h4>
                <p>PHC Rampur</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ============================================
    // NAVIGATION & INTERACTION
    // ============================================

    function navigateToPatient(patientId) {
      selectedPatientId = patientId;
      currentView = 'patient';
      render();
    }

    function navigateToDashboard() {
      currentView = 'dashboard';
      selectedPatientId = null;
      render();
    }

    function updateSearch(value) {
      searchQuery = value;
      currentView = 'dashboard';
      render();
    }

    function showConsentModal() {
      showConsent = true;
      render();
    }

    function showConsentModalGlobal() {
      selectedPatientId = null;
      showConsent = true;
      currentView = 'patient';
      render();
    }

    function hideConsentModal(event) {
      if (!event || event.target.classList.contains('modal-overlay') || event.target.classList.contains('modal-close')) {
        showConsent = false;
        render();
      }
    }

    // ============================================
    // MAIN RENDER
    // ============================================

    function render() {
      const app = document.getElementById('app');

      if (currentView === 'dashboard') {
        app.innerHTML = renderSidebar() + renderDashboard();
      } else if (currentView === 'patient') {
        const patient = selectedPatientId ? patients.find(p => p.id === selectedPatientId) : null;
        if (patient) {
          app.innerHTML = renderSidebar() + renderPatientDetail(patient);
        } else {
          app.innerHTML = renderSidebar() + renderDashboard();
        }
      }
    }

    // Initial render
    render();
  </script>
</body>
</html>
